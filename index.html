  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased">
    <div id="root">
      <div
        id="la-boot-loader"
        style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;font-family:'Cairo','Plus Jakarta Sans',system-ui,sans-serif;text-align:center;background:#F6F8FC;color:#0F172A;"
      >
        <div style="width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#1E3A8A,#2563EB,#6D28D9);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:20px;box-shadow:0 10px 25px rgba(37,99,235,.25);">✓</div>
        <div style="font-size:16px;font-weight:700;">LA2EETOH · لقيته</div>
        <div id="la-boot-status" style="font-size:13px;color:#475569;max-width:340px;line-height:1.7;">جاري تحميل المنصة...</div>
      </div>
    </div>
    <script>
      (function () {
        function showBootRetry(msg) {
          var el = document.getElementById('la-boot-status');
          if (!el) return;
          el.innerHTML =
            msg +
            '<br/><button onclick="location.reload()" style="margin-top:10px;padding:8px 18px;border-radius:10px;background:#2563EB;color:#fff;border:0;cursor:pointer;font-weight:700;font-size:13px;">إعادة تحميل الصفحة</button>';
        }
        window.addEventListener(
          'error',
          function (e) {
            if (document.getElementById('la-boot-loader')) {
              if (e && e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
                showBootRetry('تعذر تحميل بعض ملفات التشغيل بسبب الشبكة.');
              } else if (e && e.message) {
                showBootRetry('حدث خطأ أثناء تشغيل الصفحة.');
              }
            }
          },
          true
        );
        setTimeout(function () {
          if (document.getElementById('la-boot-loader')) {
            showBootRetry('التحميل يستغرق وقتاً أطول من المعتاد. تأكد من الاتصال بالإنترنت أو أعد التحميل.');
          }
        }, 10000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
