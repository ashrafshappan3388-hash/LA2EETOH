<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LA2EETOH — Egypt Lost &amp; Found Platform | لقيته</title>
    <meta
      name="description"
      content="Bilingual Egyptian lost-and-found platform with interactive Google Maps across all 27 governorates, AI visual search, smart QR tags, recovery tracking, and verified institutional intake."
    />
    <meta property="og:title" content="LA2EETOH — Egypt Lost & Found Platform" />
    <meta
      property="og:description"
      content="Report, search, map, and safely recover lost and found belongings across all 27 Egyptian governorates."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='4' y1='4' x2='44' y2='44' gradientUnits='userSpaceOnUse'%3E%3Cstop offset='0%25' stop-color='%231E3A8A'/%3E%3Cstop offset='55%25' stop-color='%232563EB'/%3E%3Cstop offset='100%25' stop-color='%236D28D9'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='2' y='2' width='44' height='44' rx='12' fill='url(%23g)'/%3E%3Cpath d='M24 10C17.925 10 13 14.925 13 21C13 28.6 24 38 24 38C24 38 35 28.6 35 21C35 14.925 30.075 10 24 10Z' fill='%23FFFFFF' fill-opacity='0.14' stroke='%23E2B857' stroke-width='2'/%3E%3Cpath d='M19.5 21.2L22.6 24.3L28.8 17.8' stroke='%23FFFFFF' stroke-width='2.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='24' cy='21' r='2' fill='%23E2B857' fill-opacity='0'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased">
    <div id="root">
      <div
        id="la-boot-loader"
        style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;font-family:'Cairo','Plus Jakarta Sans',system-ui,sans-serif;text-align:center;background:#F6F8FC;color:#0F172A;"
      >
        <div style="width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#1E3A8A,#2563EB,#6D28D9);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:20px;box-shadow:0 10px 25px rgba(37,99,235,.25);">✓</div>
        <div style="font-size:16px;font-weight:700;">LA2EETOH · لقيته</div>
        <div id="la-boot-status" style="font-size:13px;color:#475569;">جاري تحميل المنصة...</div>
      </div>
    </div>
    <script>
      window.addEventListener('error', function (e) {
        var el = document.getElementById('la-boot-status');
        if (el && e && e.target && e.target.tagName === 'SCRIPT') {
          el.innerHTML = 'تعذر تحميل ملفات التشغيل. <button onclick="location.reload()" style="margin-inline-start:8px;padding:4px 12px;border-radius:8px;background:#2563EB;color:#fff;border:0;cursor:pointer;font-weight:700;">إعادة المحاولة</button>';
        }
      }, true);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
